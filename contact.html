<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | UnifiedOps</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-white text-gray-900">
  <nav class="site-nav">
    <div class="max-w-6xl mx-auto flex justify-between items-center px-6 py-4">
      <a href="index.html" class="flex items-center gap-3">
        <span class="logo-mark">UO</span>
        <span class="text-lg font-bold heading-font tracking-tight">UnifiedOps</span>
      </a>
      <a href="contact.html" class="btn-primary text-sm !py-2.5 !px-5">Book a Call</a>
    </div>
  </nav>

  <section class="contact-hero min-h-[calc(100vh-73px)] flex flex-col justify-between py-20 px-6 text-center">
    <div class="max-w-xl mx-auto w-full">
      <span class="eyebrow mb-6">Get in touch</span>
      <h1 class="heading-font text-4xl font-bold mb-4 text-white mt-6">Let's Talk</h1>
      <p class="text-lg text-slate-300 mb-10">Fill out the form and we'll be in touch within 24 hours.</p>
      <form class="text-left space-y-5 bg-white p-8 rounded-2xl shadow-2xl">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Your Name</label>
          <input type="text" placeholder="Jane Contractor" class="form-field" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Your Email</label>
          <input type="email" placeholder="jane@example.com" class="form-field" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">How can we help?</label>
          <textarea placeholder="Tell us a bit about your business" class="form-field h-32"></textarea>
        </div>
        <button class="btn-primary w-full">Send Message</button>
      </form>
    </div>

    <footer class="text-center pt-16 text-sm text-slate-400">
      &copy; 2026 UnifiedOps. All rights reserved.
    </footer>
  </section>

</body>
</html>
